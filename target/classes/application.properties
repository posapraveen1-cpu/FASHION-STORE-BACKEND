server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/fashion_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5500}
app.jwt-secret=${JWT_SECRET:local-development-only-change-this-secret-before-deployment-2026}
